[project]
name = "gen-hack"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "altair>=6.1.0",
    "cartopy>=0.25.0",
    "cdsapi>=0.7.7",
    "geopandas>=1.1.2",
    "kaleido>=1.3.0",
    "matplotlib>=3.10.0",
    "netcdf4>=1.7.3",
    "numpy==2.3.0",
    "pandas>=2.3.3",
    "plotly>=6.0.0",
    "polars>=1.36.1",
    "pyarrow>=23.0.1",
    "pyproj>=3.7.0",
    "rasterio>=1.4.4",
    "ruff>=0.15.8",
    "scienceplots>=2.2.2",
    "scikit-learn>=1.8.0",
    "scipy>=1.16.3",
    "seaborn>=0.13.2",
    "shapely>=2.1.2",
    "vl-convert-python>=1.9.0.post1",
    "xarray>=2025.12.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/py"]

[tool.ruff]
line-length = 100
src = ["src"]
extend-exclude = ["data", "data2"]
